# Tự chạy unit test của ZeroBook mỗi khi có pull request hoặc push lên main.
# File này nằm ở thư mục gốc của repo Learn-Kotlin: .github/workflows/zerobook-ci.yml
name: ZeroBook CI

on:
  pull_request:
    paths:
      - "ZeroBook/**"
      - ".github/workflows/zerobook-ci.yml"
  push:
    branches: [main]
    paths:
      - "ZeroBook/**"
      - ".github/workflows/zerobook-ci.yml"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZeroBook

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Plugin google-services cần file này để build. Nếu repo không chứa nó,
      # lấy từ secret GOOGLE_SERVICES_JSON (Settings → Secrets and variables → Actions).
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -z "$GOOGLE_SERVICES_JSON" ]; then
              echo "::error::Thiếu app/google-services.json và secret GOOGLE_SERVICES_JSON"
              exit 1
            fi
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      # File gradlew commit từ Windows thường mất quyền chạy
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Unit test dùng repository giả nên không cần API key hay keystore
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ZeroBook/app/build/reports/tests/testDebugUnitTest/
